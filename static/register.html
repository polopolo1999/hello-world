<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — OXYDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OXYDE">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<style>

  /* Ambient background mesh */
  body { position: relative; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 12% -8%, rgba(99,102,241,.16), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(139,92,246,.13), transparent 40%),
      radial-gradient(circle at 50% 105%, rgba(16,185,129,.07), transparent 45%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(148,163,184,.10) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(circle at 50% 0%, #000, transparent 70%);
    mask-image: radial-gradient(circle at 50% 0%, #000, transparent 70%);
  }
  ::selection { background: rgba(99,102,241,.35); color: #fff; }
  *:focus-visible { outline: 2px solid rgba(99,102,241,.7); outline-offset: 2px; border-radius: 10px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border: 3px solid transparent; background-clip: content-box; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; background-clip: content-box; }
  /* Glass-ring panels: gradient hairline border without touching layout */
  .panel { position: relative; isolation: isolate; }
  .panel::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(140deg, rgba(129,140,248,.4), rgba(255,255,255,.04) 32%, rgba(167,139,250,.22) 68%, rgba(255,255,255,.03));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none; opacity: .55;
  }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto w-full border-b border-slate-900">
        <a href="/" class="flex items-center gap-2.5 group cursor-pointer">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-600/30 group-hover:shadow-indigo-500/50 group-hover:scale-105 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <span class="text-xl font-black tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">OXYDE</span>
        </a>
    </header>

    <!-- Main Content (Register Form Card) -->
    <main class="flex items-center justify-center px-4 py-12 flex-grow">
        <div class="bg-slate-900/70 backdrop-blur-xl border border-slate-800/60 rounded-3xl panel p-8 max-w-md w-full shadow-xl">
            
            <div class="text-center mb-8">
                <div class="text-xs font-semibold text-indigo-400 tracking-wider uppercase mb-2">ACCOUNT</div>
                <h1 class="text-2xl font-bold text-white mb-1">Create Your Account</h1>
                <p class="text-sm text-slate-400">One step away from your first store</p>
            </div>

            <!-- Error Alert Box -->
            <div id="err" class="hidden mb-6 p-4 rounded-2xl bg-red-950/50 border border-red-500/30 text-red-300 text-sm"></div>

            <form id="form" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-medium text-slate-300 mb-2">Email</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                </div>

                <div>
                    <label for="password" class="block text-xs font-medium text-slate-300 mb-2">Password</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="••••••••"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm">
                    <div class="text-[11px] text-slate-500 mt-1.5">At least 8 characters</div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-br from-indigo-500 to-violet-600 hover:from-indigo-400 hover:to-violet-500 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-500/30 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm mt-2">
                    Create Account
                </button>
            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="h-px bg-slate-800 flex-1"></div>
                <span class="text-xs text-slate-500">OR</span>
                <div class="h-px bg-slate-800 flex-1"></div>
            </div>

            <a href="/auth/google/login" class="w-full flex items-center justify-center gap-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-100 font-medium py-3 rounded-xl transition text-sm">
                <svg class="w-4 h-4" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.4 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.4 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.5C29.6 35.3 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.5C41.1 36 44 30.5 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
                <span>Continue with Google</span>
            </a>

            <div class="text-center mt-6 text-sm text-slate-400">
                Already have an account? <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Sign in</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-600">
        &copy; 2026 OXYDE. All rights reserved.
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Creating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await Api.register(email, password);
        const loginRes = await Api.login(email, password);
        Api.setToken(loginRes.access_token);
        window.location.href = 'dashboard.html';
      } catch (e2) {
        err.textContent = e2.message || 'An error occurred during account creation.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
    </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
