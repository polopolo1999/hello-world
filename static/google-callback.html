<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in… — OXYDE</title>
</head>
<body style="background:#020617;color:#e2e8f0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:100vh;margin:0;position:relative;overflow:hidden;">
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 0%, rgba(99,102,241,.16), transparent 42%), radial-gradient(circle at 85% 15%, rgba(139,92,246,.13), transparent 40%);"></div>
    <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(99,102,241,.6);z-index:1;">
        <svg width="20" height="20" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <div style="width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(99,102,241,.25);border-top-color:#818cf8;animation:spin .8s linear infinite;z-index:1;"></div>
    <p style="z-index:1;color:#94a3b8;font-size:14px;">Signing you in…</p>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) {
        localStorage.setItem('oxyde_token', token);
        window.location.replace('dashboard.html');
    } else {
        window.location.replace('/login.html?error=google_failed');
    }
    </script>
</body>
</html>
